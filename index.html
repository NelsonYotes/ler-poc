// ─── AI SERVICE ──────────────────────────────────────────────
async function generateLERSummary(credentials, customSkills) {
  await new Promise(r => setTimeout(r, 1400));
  const allSkills = [...new Set([...credentials.flatMap(c=>c.skills), ...customSkills])].slice(0,12);
  const degree = credentials.find(c=>c.type==='Degree');
  const certs = credentials.filter(c=>c.type==='Certification');
  const hasCLR = credentials.some(c=>c.type==='CLR');
  const hasBadge = credentials.some(c=>c.type==='Badge');
  const parts = [];
  if (degree) parts.push(`Holds a verified ${degree.name} from ${degree.issuer}.`);
  if (certs.length>0) parts.push(`Complemented by ${certs.length} industry certification${certs.length>1?'s':''} including ${certs.map(c=>c.name).join(' and ')}.`);
  if (hasCLR) parts.push('Co-curricular record documents rich experiential learning spanning leadership, research, and community engagement.');
  if (hasBadge) parts.push('Digital badges validate specialized proficiency in high-demand skill areas.');
  if (customSkills.length>0) parts.push(`Additional self-developed expertise in ${customSkills.slice(0,3).join(', ')}.`);
  if (parts.length===0) parts.push('Motivated professional with a verified credential portfolio demonstrating technical and collaborative expertise.');
  return {executiveSummary:parts.join(' '), skillsProfile:allSkills};
}

function matchOpportunities(ler) {
  const skills = [...(ler.skillsProfile||[]),...(ler.customSkills||[]),...(ler.softSkills||[])].map(s=>s.toLowerCase());
  return MOCK_OPPORTUNITIES.filter(opp=>opp.requirements.some(req=>skills.some(s=>s.includes(req.toLowerCase())||req.toLowerCase().includes(s))));
}

// ─── LER BUILDER ─────────────────────────────────────────────
const LERBuilder = ({credentials,onSave,onCancel,initialLer=null,initialSelectedIds=[]}) => {
  const [step,setStep]=React.useState(initialLer?2:1);
  const [title,setTitle]=React.useState(initialLer?.title||'');
  const [targetRole,setTargetRole]=React.useState(initialLer?.targetRole||'');
  const [selectedIds,setSelectedIds]=React.useState(initialLer?.credentialIds||initialSelectedIds);
  const [summary,setSummary]=React.useState(initialLer?.executiveSummary||'');
  const [skills,setSkills]=React.useState(initialLer?.skillsProfile||[]);
  const [customSkills,setCustomSkills]=React.useState(initialLer?.customSkills||[]);
  const [newSkill,setNewSkill]=React.useState('');
  const [isGenerating,setIsGenerating]=React.useState(false);
  const [editingSkill,setEditingSkill]=React.useState(null);
  const [status,setStatus]=React.useState(initialLer?.status||'Published');
  const [search,setSearch]=React.useState('');

  const filteredCreds=React.useMemo(()=>credentials.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())||c.issuer.toLowerCase().includes(search.toLowerCase())||c.skills.some(s=>s.toLowerCase().includes(search.toLowerCase()))),[credentials,search]);
  const grouped=React.useMemo(()=>({'Comprehensive Learner Records':filteredCreds.filter(c=>c.type==='CLR'),'Diplomas':filteredCreds.filter(c=>c.type==='Degree'),'Certificates & Courses':filteredCreds.filter(c=>c.type==='Certification'||c.type==='Course'),'Digital Badges':filteredCreds.filter(c=>c.type==='Badge')}),[filteredCreds]);
  const toggle=id=>setSelectedIds(prev=>prev.includes(id)?prev.filter(i=>i!==id):[...prev,id]);

  const handleGenerate=async(regen=false)=>{
    if(!title.trim())return;
    setIsGenerating(true);
    try{const creds=credentials.filter(c=>selectedIds.includes(c.id));const result=await generateLERSummary(creds,customSkills);setSummary(result.executiveSummary);if(!regen){setSkills(result.skillsProfile);setStep(2);}}
    catch(e){console.error(e);}finally{setIsGenerating(false);}
  };

  const addSkill=()=>{const t=newSkill.trim();if(t&&!customSkills.includes(t)&&!skills.includes(t)){setCustomSkills(p=>[...p,t]);setNewSkill('');}};
  const saveEdit=()=>{if(!editingSkill)return;const{type,index,value}=editingSkill;if(value.trim()){if(type==='verified')setSkills(p=>p.map((s,i)=>i===index?value.trim():s));else setCustomSkills(p=>p.map((s,i)=>i===index?value.trim():s));}setEditingSkill(null);};

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto" style={{background:'rgba(39,53,64,0.75)'}}>
      <div className="bg-white rounded-lg shadow-xl w-full max-w-[1040px] max-h-[94vh] flex flex-col border my-4" style={{borderColor:'#D7DADE'}}>
        <div className="px-7 py-5 flex items-center justify-between shrink-0" style={{borderBottom:'1px solid #D7DADE'}}>
          <div>
            <h2 className="text-lg font-bold" style={{color:'#273540'}}>{initialLer?'Edit Learning & Employment Record':'Build a Learning & Employment Record'}</h2>
            <div className="flex items-center gap-2 mt-2">
              {[1,2].map(s=>(
                <React.Fragment key={s}>
                  <div className="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold border-2 transition-all" style={step===s?{background:'#2B7ABC',color:'#fff',borderColor:'#2B7ABC'}:step>s?{background:'#03893D',color:'#fff',borderColor:'#03893D'}:{background:'#fff',color:'#9EA6AD',borderColor:'#D7DADE'}}>
                    {step>s?<svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"/></svg>:s}
                  </div>
                  <span className="text-xs font-bold uppercase tracking-wide" style={{color:step===s?'#273540':'#9EA6AD'}}>{s===1?'Select Evidence':'Refine Profile'}</span>
                  {s<2&&<div className="w-8 h-px" style={{background:'#D7DADE'}}/>}
                </React.Fragment>
              ))}
            </div>
          </div>
          <button onClick={onCancel} className="p-2 rounded hover:bg-[#F2F4F4] transition-colors" style={{color:'#9EA6AD'}}><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
        </div>

        <div className="flex-1 overflow-y-auto p-7" style={{background:'#F2F4F4'}}>
          {step===1&&(
            <div className="space-y-6 fade-in">
              <div className="bg-white rounded-lg border p-5 space-y-4" style={{borderColor:'#D7DADE'}}>
                <div><label className="block text-xs font-bold uppercase tracking-wide mb-1.5" style={{color:'#2B7ABC'}}>Record Title *</label><input autoFocus type="text" value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. Software Engineering Portfolio" className="instui-input w-full px-3 py-2.5 rounded border text-base font-bold" style={{borderColor:'#D7DADE',color:'#273540'}}/></div>
                <div><label className="block text-xs font-bold uppercase tracking-wide mb-1.5" style={{color:'#9EA6AD'}}>Target Role or Goal <span className="font-normal">(optional)</span></label><input type="text" value={targetRole} onChange={e=>setTargetRole(e.target.value)} placeholder="e.g. Cloud Architect, Graduate School, Product Manager" className="instui-input w-full px-3 py-2.5 rounded border text-sm" style={{borderColor:'#D7DADE',color:'#273540'}}/></div>
              </div>
              <div className="bg-white rounded-lg border p-5" style={{borderColor:'#D7DADE'}}>

// ─── DASHBOARD PAGE (institution-grouped) ────────────────────
const INDUSTRY_ISSUERS = ['Amazon Web Services','Frontend Masters','MIT Department of Computer Science','Coursera / Johns Hopkins','Project Management Institute','National Student Leadership Conference'];
const INST_COLORS = {
  'Mount Elbert University':{bar:'#1a5c8a',text:'#1a5c8a'},
  'Appletree High School':{bar:'#2d6a4f',text:'#2d6a4f'},
  'West Valley Community College':{bar:'#c95e1e',text:'#c95e1e'},
  'University of Florida':{bar:'#0021A5',text:'#0021A5'},
  'The University of Alabama':{bar:'#9E1B32',text:'#9E1B32'},
  'Professional & Industry':{bar:'#9242B4',text:'#9242B4'},
};

const DashboardPage = ({credentials,onViewCLR,onAddCred}) => {
  const [search,setSearch]=React.useState('');
  const filtered=React.useMemo(()=>search?credentials.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())||c.issuer.toLowerCase().includes(search.toLowerCase())):credentials,[credentials,search]);

  const groups=React.useMemo(()=>{
    const g={};
    filtered.forEach(c=>{
      const key=INDUSTRY_ISSUERS.includes(c.issuer)?'Professional & Industry':c.issuer;
      if(!g[key])g[key]=[];
      g[key].push(c);
    });
    return Object.entries(g).sort(([a],[b])=>{
      if(a==='Professional & Industry')return 1;
      if(b==='Professional & Industry')return-1;
      return a.localeCompare(b);
    });
  },[filtered]);

  return (
    <div className="fade-in space-y-7">
      <div className="flex items-center justify-between gap-4">
        <div>
          <h1 className="text-2xl font-bold" style={{color:'#273540'}}>Dashboard</h1>
          <p className="text-sm mt-0.5" style={{color:'#586874'}}>{credentials.length} credentials from {groups.length} institution{groups.length!==1?'s':''}</p>
        </div>
        <div className="flex items-center gap-3">
          <div className="relative">
            <svg className="w-4 h-4 absolute left-3 top-2.5" style={{color:'#9EA6AD'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" placeholder="Search credentials…" value={search} onChange={e=>setSearch(e.target.value)} className="instui-input pl-9 pr-4 py-2 text-sm border rounded w-52" style={{background:'#fff',borderColor:'#D7DADE',color:'#273540'}}/>
          </div>
          <Button variant="outline" size="md" onClick={onAddCred}>+ Add Credential</Button>
        </div>
      </div>

      {groups.length===0&&<div className="bg-white border-2 border-dashed rounded-lg p-12 text-center" style={{borderColor:'#D7DADE'}}><p className="font-bold" style={{color:'#9EA6AD'}}>No credentials match your search.</p></div>}

      {groups.map(([institution,creds])=>{
        const color=INST_COLORS[institution]||{bar:'#2B7ABC',text:'#2B7ABC'};
        const hasCLR=creds.some(c=>c.type==='CLR');
        return (
          <div key={institution} className="bg-white rounded-lg border overflow-hidden" style={{borderColor:'#D7DADE'}}>
            <div className="h-1.5" style={{background:color.bar}}/>
            <div className="px-6 pt-5 pb-6">
              <div className="flex items-center justify-between mb-5">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-lg border flex items-center justify-center shrink-0" style={{background:'#F2F4F4',borderColor:'#E8EAEC'}}>
                    <span className="text-lg font-black" style={{color:color.text}}>{institution.charAt(0)}</span>
                  </div>
                  <div>
                    <h2 className="font-bold text-base" style={{color:'#273540'}}>{institution}</h2>
                    <p className="text-xs mt-0.5" style={{color:'#9EA6AD'}}>{creds.length} credential{creds.length!==1?'s':''}{hasCLR?' · Includes Co-curricular Record':''}</p>
                  </div>
                </div>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                {creds.map(cred=><CredentialCard key={cred.id} credential={cred} onView={onViewCLR}/>)}
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
};

                {lers.map(l=><option key={l.id} value={l.id}>{l.title}</option>)}
              </select>
              <svg className="w-4 h-4 absolute right-2.5 top-2.5 pointer-events-none" style={{color:'#9EA6AD'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"/></svg>
            </div>
          )}
          <Button variant="primary" size="md" onClick={onNewLer}>+ New LER</Button>
        </div>
      </div>

      {/* Active LER hero */}
      {activeLer&&(
        <div className="rounded-lg p-6 text-white" style={{background:'linear-gradient(135deg,#334451 0%,#273540 100%)'}}>
          <div className="flex items-start justify-between gap-4">
            <div className="flex-1 min-w-0">
              <p className="text-xs font-bold uppercase tracking-widest mb-2" style={{color:'rgba(255,255,255,0.6)'}}>Active Learning &amp; Employment Record</p>
              <h2 className="text-xl font-bold leading-tight mb-2">{activeLer.title}</h2>
              <p className="text-sm leading-relaxed line-clamp-2 mb-4" style={{color:'rgba(255,255,255,0.8)'}}>{activeLer.executiveSummary}</p>
              <div className="flex flex-wrap gap-4 text-sm font-bold">
                <span>{activeLer.credentialIds.length} Credentials</span>
                <span style={{color:'rgba(255,255,255,0.4)'}}>·</span>
                <span>{(activeLer.skillsProfile.length+activeLer.customSkills.length)} Skills</span>
                <span style={{color:'rgba(255,255,255,0.4)'}}>·</span>
                <span>{matchedOpps.length} Opportunities Matched</span>
              </div>
            </div>
            <div className="flex flex-col gap-2 shrink-0 no-print">
              <button onClick={()=>onViewLer(activeLer.id)} className="instui-btn px-3 py-1.5 text-sm min-h-[1.875rem]" style={{background:'rgba(255,255,255,0.12)',border:'1px solid rgba(255,255,255,0.25)',color:'#fff'}}>View Record</button>
              <button onClick={()=>onEditLer(activeLer)} className="instui-btn px-3 py-1.5 text-sm min-h-[1.875rem]" style={{background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.2)',color:'#fff'}}>Edit</button>
            </div>
          </div>
          <div className="mt-5 pt-5" style={{borderTop:'1px solid rgba(255,255,255,0.15)'}}>
            <p className="text-xs font-bold uppercase tracking-widest mb-3" style={{color:'rgba(255,255,255,0.5)'}}>Top Skills</p>
            <div className="flex flex-wrap gap-2">
              {activeLer.skillsProfile.slice(0,6).map(skill=><span key={skill} className="px-3 py-1 text-xs font-bold rounded" style={{background:'rgba(255,255,255,0.12)',color:'#fff',border:'1px solid rgba(255,255,255,0.18)'}}>{skill}</span>)}
              {activeLer.skillsProfile.length>6&&<span className="px-3 py-1 text-xs font-bold rounded" style={{background:'rgba(255,255,255,0.07)',color:'rgba(255,255,255,0.6)'}}>+{activeLer.skillsProfile.length-6} more</span>}
            </div>
          </div>
        </div>
      )}

      {/* My Records */}
      <div>
        <div className="flex items-center justify-between mb-4">
          <h2 className="text-base font-bold uppercase tracking-wide" style={{color:'#273540'}}>My Records ({lers.length})</h2>
        </div>
        {lers.length===0
          ?<div className="bg-white border-2 border-dashed rounded-lg p-12 text-center" style={{borderColor:'#D7DADE'}}><div className="text-5xl mb-4">📋</div><p className="text-sm mb-4 font-bold" style={{color:'#586874'}}>You haven't built any records yet.</p><Button variant="primary" size="md" onClick={onNewLer}>Build Your First LER</Button></div>
          :<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{lers.map(ler=><LERCard key={ler.id} ler={ler} isActive={activeLerId===ler.id} onSelect={()=>onSetActiveLer(ler.id)} onView={()=>onViewLer(ler.id)} onToggleStatus={()=>onToggleLerStatus(ler.id)} onDelete={()=>onDeleteLer(ler.id)}/>)}</div>}
      </div>

      {/* Top Matched Opportunities */}
      {matchedOpps.length>0&&(
        <div>
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-base font-bold uppercase tracking-wide" style={{color:'#273540'}}>Top Matched Opportunities</h2>
            <button onClick={()=>setShowAllOpps(true)} className="text-sm font-bold hover:underline" style={{color:'#2B7ABC'}}>View All ({matchedOpps.length}) →</button>
          </div>
          <div className="space-y-3">{matchedOpps.slice(0,3).map(opp=><OpportunityCard key={opp.id} opp={opp}/>)}</div>
        </div>
      )}

      {showAllOpps&&<OpportunitiesModal opps={matchedOpps} lerTitle={activeLer?.title} onClose={()=>setShowAllOpps(false)}/>}
    </div>
  );
};

// ─── ORDERS PAGE ─────────────────────────────────────────────
const OrdersPage = () => {
  const statusStyle = s => s==='Delivered'?{background:'#DCEEE4',color:'#027634',border:'1px solid #B8DEC6'}:s==='Processing'?{background:'#E0EBF5',color:'#0E68B3',border:'1px solid #C0D9EE'}:{background:'#FCE4E5',color:'#C71F23',border:'1px solid #F0B8BB'};
  const statusIcon = s => s==='Delivered'?'✓ Delivered':s==='Processing'?'⟳ Processing':'✕ Cancelled';
  return (
    <div className="fade-in space-y-7">
      <div>
        <h1 className="text-2xl font-bold" style={{color:'#273540'}}>Orders</h1>
        <p className="text-sm mt-0.5" style={{color:'#586874'}}>Your credential request history</p>
      </div>
      {MOCK_ORDERS.map(order=>(
        <div key={order.id} className="bg-white rounded-lg border overflow-hidden" style={{borderColor:'#D7DADE'}}>
          <div className="px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3" style={{background:'#F2F4F4',borderBottom:'1px solid #E8EAEC'}}>
            <div className="flex flex-wrap items-center gap-4">
              <div>
                <p className="text-[10px] font-bold uppercase tracking-wide" style={{color:'#9EA6AD'}}>Order Date</p>
                <p className="text-sm font-bold" style={{color:'#273540'}}>{new Date(order.date).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</p>
              </div>
              <div className="h-8 w-px hidden sm:block" style={{background:'#D7DADE'}}/>
              <div>
                <span className="text-xs font-bold px-2.5 py-1 rounded" style={statusStyle(order.status)}>{statusIcon(order.status)}</span>
                <p className="text-xs mt-1" style={{color:'#9EA6AD'}}>{order.statusDetail}</p>
              </div>
            </div>
            <div className="text-right shrink-0">
              <p className="text-[10px] font-bold uppercase tracking-wide" style={{color:'#9EA6AD'}}>Total</p>
              <p className="text-xl font-bold" style={{color:'#273540'}}>{order.total===0?'Free':'$'+order.total.toFixed(2)}</p>
            </div>
          </div>
          <div className="px-6 py-5">
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-4">
              <div>
                <p className="text-[10px] font-bold uppercase tracking-wide mb-1" style={{color:'#9EA6AD'}}>Document</p>
                <p className="text-sm font-bold" style={{color:'#273540'}}>{order.document}</p>
                <p className="text-xs mt-0.5" style={{color:'#586874'}}>For: {order.purpose}</p>
              </div>
              <div>
                <p className="text-[10px] font-bold uppercase tracking-wide mb-1" style={{color:'#9EA6AD'}}>From</p>
                <p className="text-sm" style={{color:'#273540'}}>{order.from}</p>
              </div>
              <div>
                <p className="text-[10px] font-bold uppercase tracking-wide mb-1" style={{color:'#9EA6AD'}}>To</p>
                <p className="text-sm" style={{color:'#273540'}}>{order.to}</p>
              </div>
            </div>
            {order.total>0&&(
              <div className="flex gap-6 text-xs pt-4" style={{borderTop:'1px solid #E8EAEC'}}>
                <span style={{color:'#9EA6AD'}}>Subtotal: <strong style={{color:'#273540'}}>${order.subtotal.toFixed(2)}</strong></span>
                <span style={{color:'#9EA6AD'}}>Processing fee: <strong style={{color:'#273540'}}>${order.fee.toFixed(2)}</strong></span>
              </div>
            )}
          </div>
          {order.status==='Delivered'&&(
            <div className="px-6 pb-4 flex justify-end"><Button variant="outline" size="sm">⬇ Download Document</Button></div>
          )}
        </div>
      ))}
    </div>
  );
};

// ─── SETTINGS PAGE ───────────────────────────────────────────

  <div className="fade-in space-y-7 max-w-2xl">
    <h1 className="text-2xl font-bold" style={{color:'#273540'}}>Settings</h1>

    <div className="bg-white rounded-lg border p-6" style={{borderColor:'#D7DADE'}}>
      <h2 className="text-xs font-bold uppercase tracking-widest mb-5 pb-3" style={{color:'#273540',borderBottom:'1px solid #E8EAEC'}}>Profile</h2>
      <div className="flex items-center gap-5 mb-6">
        <img src="https://picsum.photos/seed/jessica/80/80" className="w-20 h-20 rounded-full border-2" style={{borderColor:'#D7DADE'}} alt="Profile photo"/>
        <div><Button variant="outline" size="sm">Change Photo</Button><p className="text-xs mt-1.5" style={{color:'#9EA6AD'}}>JPG or PNG, max 5 MB</p></div>
      </div>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        {[['First Name','Jordan'],['Last Name','Anderson'],['Email','jordan.anderson@email.com'],['Phone','(555) 867-5309']].map(([label,val])=>(
          <div key={label}>

      </div>
      <div className="mt-5 flex justify-end"><Button variant="primary" size="sm">Save Changes</Button></div>
    </div>

    <div className="bg-white rounded-lg border p-6" style={{borderColor:'#D7DADE'}}>
      <h2 className="text-xs font-bold uppercase tracking-widest mb-5 pb-3" style={{color:'#273540',borderBottom:'1px solid #E8EAEC'}}>Schools Attended</h2>
      {[{name:'Mount Elbert University',enrolled:'2020 – 2024',status:'Alumni'},{name:'West Valley Community College',enrolled:'2018 – 2020',status:'Alumni'},{name:'Appletree High School',enrolled:'2015 – 2019',status:'Graduate'}].map((school,i,arr)=>(
        <div key={i} className="flex items-center justify-between py-3.5" style={i<arr.length-1?{borderBottom:'1px solid #E8EAEC'}:{}}>
          <div>
            <p className="text-sm font-bold" style={{color:'#273540'}}>{school.name}</p>
            <p className="text-xs mt-0.5" style={{color:'#9EA6AD'}}>{school.enrolled} · {school.status}</p>
          </div>
          <Button variant="ghost" size="sm">Request Credentials</Button>
        </div>
      ))}
    </div>

    <div className="bg-white rounded-lg border p-6" style={{borderColor:'#D7DADE'}}>
      <h2 className="text-xs font-bold uppercase tracking-widest mb-5 pb-3" style={{color:'#273540',borderBottom:'1px solid #E8EAEC'}}>Account</h2>
      <div className="space-y-3">
        {[{title:'Authentication Settings',desc:'Password, two-factor authentication, and sign-in options'},{title:'Privacy Settings',desc:'Control who can view and share your records'}].map(item=>(
          <div key={item.title} className="flex items-center justify-between p-4 rounded-lg" style={{background:'#F2F4F4'}}>
            <div>
              <p className="text-sm font-bold" style={{color:'#273540'}}>{item.title}</p>
              <p className="text-xs mt-0.5" style={{color:'#9EA6AD'}}>{item.desc}</p>
            </div>
            <Button variant="outline" size="sm">Manage →</Button>
          </div>
        ))}
      </div>
    </div>
  </div>
);

// ─── PUBLIC LER VIEW ─────────────────────────────────────────
const PublicLERView = ({ler,credentials}) => {
  const lerCreds=credentials.filter(c=>ler.credentialIds.includes(c.id));
  const allSkills=[...(ler.skillsProfile||[]),...(ler.customSkills||[])];
  return (
    <div className="min-h-screen" style={{background:'#F2F4F4'}}>
      <div className="no-print" style={{background:'#334451',height:'3.5rem',display:'flex',alignItems:'center',padding:'0 1.5rem'}}>
        <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
          <div style={{width:'28px',height:'28px',background:'#2B7ABC',borderRadius:'4px',display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{color:'#fff',fontWeight:'700',fontSize:'14px'}}>P</span></div>
          <span style={{color:'#fff',fontWeight:'700',fontSize:'15px'}}>Parchment</span>
          <span style={{color:'rgba(255,255,255,0.5)',fontSize:'10px',fontWeight:'400',textTransform:'uppercase',letterSpacing:'0.1em'}}>by Instructure</span>
        </div>
      </div>
      <div className="max-w-3xl mx-auto px-6 py-10">
        <div className="bg-white rounded-lg border p-8 mb-7 text-center" style={{borderColor:'#D7DADE'}}>
          <img src="https://picsum.photos/seed/jessica/80/80" className="w-20 h-20 rounded-full mx-auto mb-4 border-2" style={{borderColor:'#D7DADE'}} alt="Jordan K. Anderson"/>
          <h1 className="text-2xl font-bold" style={{color:'#273540'}}>Jordan K. Anderson</h1>
          <p className="text-xs font-bold uppercase tracking-widest mt-1 mb-4" style={{color:'#9EA6AD'}}>Learning &amp; Employment Record</p>
          <h2 className="text-xl font-bold" style={{color:'#2B7ABC'}}>{ler.title}</h2>
          {ler.targetRole&&<p className="text-sm mt-2" style={{color:'#586874'}}>Looking for: <strong style={{color:'#273540'}}>{ler.targetRole}</strong></p>}
          <div className="mt-5">
            <button onClick={()=>window.print()} className="instui-btn px-5 py-2.5 text-sm min-h-[2.375rem]" style={{background:'#2B7ABC',color:'#fff',borderColor:'#2B7ABC'}}>⬇ Download PDF</button>
          </div>
        </div>

        <div className="bg-white rounded-lg border p-6 mb-5" style={{borderColor:'#D7DADE'}}>
          <h3 className="text-xs font-bold uppercase tracking-widest mb-3" style={{color:'#2B7ABC'}}>Summary</h3>
          <p className="text-sm leading-relaxed italic pl-4" style={{color:'#586874',borderLeft:'2px solid #E8EAEC'}}>"{ler.executiveSummary}"</p>
        </div>

        {allSkills.length>0&&(
          <div className="bg-white rounded-lg border p-6 mb-5" style={{borderColor:'#D7DADE'}}>
            <h3 className="text-xs font-bold uppercase tracking-widest mb-1" style={{color:'#2B7ABC'}}>Skills</h3>
            <p className="text-[10px] mb-4" style={{color:'#9EA6AD'}}>Click any skill to view market data on Talent Neuron</p>
            <div className="flex flex-wrap gap-2">{allSkills.map(skill=>(
              <a key={skill} href={talentNeuronUrl(skill)} target="_blank" rel="noopener noreferrer" className="px-2.5 py-1 text-xs font-bold rounded" style={{background:'#E0EBF5',color:'#0E68B3',border:'1px solid #C0D9EE',textDecoration:'none'}}>{skill} ↗</a>
            ))}</div>
          </div>
        )}

        {lerCreds.length>0&&(
          <div className="bg-white rounded-lg border p-6 mb-5" style={{borderColor:'#D7DADE'}}>
            <h3 className="text-xs font-bold uppercase tracking-widest mb-4" style={{color:'#2B7ABC'}}>Credentials ({lerCreds.length})</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">{lerCreds.map(cred=><CredentialCard key={cred.id} credential={cred}/>)}</div>
          </div>
        )}

        <div className="text-center pt-4">
          <p className="text-xs" style={{color:'#9EA6AD'}}>Verified by Parchment by Instructure · {new Date().toLocaleDateString(undefined,{month:'long',year:'numeric'})}</p>
        </div>
      </div>
    </div>
  );
};

// ─── APP ─────────────────────────────────────────────────────
const App = () => {
  const lerViewId=React.useMemo(()=>new URLSearchParams(window.location.search).get('lerView'),[]);
  const [tab,setTab]=React.useState('Dashboard');
  const [lers,setLers]=React.useState([INITIAL_LER]);
  const [credentials,setCredentials]=React.useState(MOCK_CREDENTIALS);
  const [activeLerId,setActiveLerId]=React.useState('ler-1');
  const [viewingLerId,setViewingLerId]=React.useState(null);
  const [showBuilder,setShowBuilder]=React.useState(false);
  const [editingLer,setEditingLer]=React.useState(null);
  const [showAddCred,setShowAddCred]=React.useState(false);
  const [clrPreviewId,setClrPreviewId]=React.useState(null);

  // Public view
  if(lerViewId){
    const publicLer=lers.find(l=>l.id===lerViewId)||(lerViewId===INITIAL_LER.id?INITIAL_LER:null);
    if(!publicLer)return <div className="min-h-screen flex items-center justify-center" style={{background:'#F2F4F4'}}><div className="text-center"><p className="text-5xl mb-4">🔍</p><p className="font-bold" style={{color:'#273540'}}>Learning &amp; Employment Record not found.</p></div></div>;
    return <PublicLERView ler={publicLer} credentials={credentials}/>;
  }

  const viewingLer=lers.find(l=>l.id===viewingLerId)||null;
  const saveLer=ler=>{setLers(prev=>{const ex=prev.find(l=>l.id===ler.id);return ex?prev.map(l=>l.id===ler.id?ler:l):[ler,...prev];});setActiveLerId(ler.id);setShowBuilder(false);setEditingLer(null);};
  const deleteLer=id=>{if(!confirm('Delete this Learning & Employment Record? This cannot be undone.'))return;setLers(prev=>prev.filter(l=>l.id!==id));if(activeLerId===id)setActiveLerId(lers.find(l=>l.id!==id)?.id||'');if(viewingLerId===id)setViewingLerId(null);};

  const TABS=['Dashboard','Opportunities','Orders','Settings'];

  return (
    <div className="min-h-screen flex flex-col" style={{background:'#F2F4F4'}}>
      <nav className="sticky top-0 z-40 no-print" style={{background:'#334451',height:'4rem'}}>
        <div className="max-w-[1280px] mx-auto h-full flex justify-between items-center px-6">
          <div className="flex items-center gap-3 cursor-pointer select-none" onClick={()=>{setViewingLerId(null);setTab('Dashboard');}}>
            <div className="w-8 h-8 bg-[#2B7ABC] rounded flex items-center justify-center"><span className="text-white font-bold text-base">P</span></div>
            <div className="flex flex-col leading-none">
              <span className="text-white font-bold text-lg">Parchment</span>
              <span className="text-white/60 text-[10px] font-normal uppercase tracking-widest">by Instructure</span>
            </div>
          </div>
          <div className="flex items-center gap-2.5">
            <img src="https://picsum.photos/seed/jessica/32/32" className="w-8 h-8 rounded-full border-2 border-white/30" alt=""/>
            <span className="text-white/90 text-sm">Hello, <strong className="text-white font-bold">Jessica</strong></span>
          </div>
        </div>
      </nav>

      {!viewingLerId&&(
        <div className="bg-white border-b px-6 no-print" style={{borderColor:'#D7DADE'}}>
          <div className="max-w-[1280px] mx-auto flex gap-1">
            {TABS.map(t=>(
              <button key={t} onClick={()=>setTab(t)} className="relative h-14 px-4 text-sm font-bold transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#2B7ABC]" style={{color:tab===t?'#2B7ABC':'#6A7883'}}>
                {t}
                {tab===t&&<div className="absolute bottom-0 left-0 w-full h-0.5 rounded-t" style={{background:'#2B7ABC'}}/>}
              </button>
            ))}
          </div>
        </div>
      )}

      <main className="flex-1 max-w-[1280px] w-full mx-auto px-6 py-8">
        {clrPreviewId&&<CLRPreviewModal credential={credentials.find(c=>c.id===clrPreviewId)} onClose={()=>setClrPreviewId(null)}/>}

        {viewingLerId&&viewingLer&&(
          <LERDetailView ler={viewingLer} credentials={credentials} onBack={()=>setViewingLerId(null)} onEdit={()=>{setEditingLer(viewingLer);setShowBuilder(true);}} onUpdate={u=>setLers(prev=>prev.map(l=>l.id===u.id?u:l))} isOwner={true}/>
        )}

        {!viewingLerId&&tab==='Dashboard'&&(
          <DashboardPage credentials={credentials} onViewCLR={id=>setClrPreviewId(id)} onAddCred={()=>setShowAddCred(true)}/>
        )}

        {!viewingLerId&&tab==='Opportunities'&&(
          <OpportunitiesPage
            lers={lers}
            activeLerId={activeLerId}
            credentials={credentials}
            onSetActiveLer={setActiveLerId}
            onViewLer={id=>setViewingLerId(id)}
            onNewLer={()=>setShowBuilder(true)}
            onEditLer={ler=>{setEditingLer(ler);setShowBuilder(true);}}
            onDeleteLer={deleteLer}
            onToggleLerStatus={id=>setLers(prev=>prev.map(l=>l.id===id?{...l,status:l.status==='Published'?'Private':'Published'}:l))}
          />
        )}

        {!viewingLerId&&tab==='Orders'&&<OrdersPage/>}
        {!viewingLerId&&tab==='Settings'&&<SettingsPage/>}
      </main>

      {showBuilder&&<LERBuilder credentials={credentials} initialLer={editingLer} initialSelectedIds={[]} onSave={saveLer} onCancel={()=>{setShowBuilder(false);setEditingLer(null);}}/>}
      {showAddCred&&<AddCredentialModal onSave={cred=>{setCredentials(prev=>[cred,...prev]);setShowAddCred(false);}} onCancel={()=>setShowAddCred(false)}/>}
    </div>
  );
};

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>

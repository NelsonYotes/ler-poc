// ═════════════════════ Utilities ═════════════════════
async function generateLERSummary(credentials, customSkills) {
  await new Promise(r => setTimeout(r, 1400));
  const allSkills = [...new Set([...credentials.flatMap(c=>c.skills), ...customSkills])].slice(0,12);
  const degree = credentials.find(c=>c.type==='Degree');
  const certs = credentials.filter(c=>c.type==='Certification');
  const hasCLR = credentials.some(c=>c.type==='CLR');
  const hasBadge = credentials.some(c=>c.type==='Badge');
  const parts = [];
  if (degree) parts.push(`Holds a verified ${degree.name} from ${degree.issuer}.`);
  if (certs.length>0) parts.push(`Complemented by ${certs.length} industry certification${certs.length>1?'s':''} including ${certs.map(c=>c.name).join(' and ')}.`);
  if (hasCLR) parts.push('Co-curricular record documents rich experiential learning spanning leadership, research, and community engagement.');
  if (hasBadge) parts.push('Digital badges validate specialized proficiency in high-demand skill areas.');
  if (customSkills.length>0) parts.push(`Additional self-developed expertise in ${customSkills.slice(0,3).join(', ')}.`);
  if (parts.length===0) parts.push('Motivated professional with a verified credential portfolio demonstrating technical and collaborative expertise.');
  return {executiveSummary:parts.join(' '), skillsProfile:allSkills};
}

function matchOpportunities(ler) {
  const skills = [...(ler.skillsProfile||[]),...(ler.customSkills||[]),...(ler.softSkills||[])].map(s=>s.toLowerCase());
  return MOCK_OPPORTUNITIES.filter(opp=>opp.requirements.some(req=>skills.some(s=>s.includes(req.toLowerCase())||req.toLowerCase().includes(s))));
}

// ═════════════════════ LER Builder ═════════════════════
const LERBuilder = ({ credentials, onSave, onCancel, initialLer=null, initialSelectedIds=[] }) => {
  const [step,setStep] = React.useState(initialLer?2:1);
  const [title,setTitle] = React.useState(initialLer?.title||'');
  const [targetRole,setTargetRole] = React.useState(initialLer?.targetRole||'');
  const [selectedIds,setSelectedIds] = React.useState(initialLer?.credentialIds||initialSelectedIds);
  const [summary,setSummary] = React.useState(initialLer?.executiveSummary||'');
  const [skills,setSkills] = React.useState(initialLer?.skillsProfile||[]);
  const [customSkills,setCustomSkills] = React.useState(initialLer?.customSkills||[]);
  const [newSkill,setNewSkill] = React.useState('');
  const [isGenerating,setIsGenerating] = React.useState(false);
  const [status,setStatus] = React.useState(initialLer?.status||'Published');
  const [search,setSearch] = React.useState('');

  const filteredCreds = React.useMemo(()=>credentials.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())||c.issuer.toLowerCase().includes(search.toLowerCase())),[credentials,search]);
  const grouped = React.useMemo(()=>({'Comprehensive Learner Records':filteredCreds.filter(c=>c.type==='CLR'),'Diplomas':filteredCreds.filter(c=>c.type==='Degree'),'Certificates & Courses':filteredCreds.filter(c=>c.type==='Certification'||c.type==='Course'),'Digital Badges':filteredCreds.filter(c=>c.type==='Badge')}),[filteredCreds]);
  const toggle = id => setSelectedIds(prev=>prev.includes(id)?prev.filter(i=>i!==id):[...prev,id]);

  const handleGenerate = async (regen=false) => {
    if (!title.trim()) return;
    setIsGenerating(true);
    try {
      const creds = credentials.filter(c=>selectedIds.includes(c.id));
      const result = await generateLERSummary(creds,customSkills);
      setSummary(result.executiveSummary);
      if (!regen) { setSkills(result.skillsProfile); setStep(2); }
    } catch(e){ console.error(e); }
    finally { setIsGenerating(false); }
  };

  const addSkill = () => { const t=newSkill.trim(); if(t&&!customSkills.includes(t)&&!skills.includes(t)){ setCustomSkills(p=>[...p,t]); setNewSkill(''); } };

  return (
    <Flex alignItems="flex-start" justifyItems="center" padding="medium" style={{position:'fixed',inset:0,zIndex:50,background:'rgba(39,53,64,0.75)',overflowY:'auto'}}>
      <View background="primary" borderRadius="medium" shadow="topmost" borderWidth="small" borderColor="primary" style={{width:'100%',maxWidth:'65rem',maxHeight:'94vh',display:'flex',flexDirection:'column',margin:'1rem 0'}}>
        <Flex justifyItems="space-between" alignItems="center" padding="medium x-large" style={{borderBottom:'var(--instui-bw-small) solid var(--instui-line-stroke)'}}>
          <View>
            <Heading level="h3">{initialLer?'Edit Learning & Employment Record':'Build a Learning & Employment Record'}</Heading>
            <Flex gap="x-small" alignItems="center" margin="x-small 0 0">
              {[1,2].map(s=>(
                <React.Fragment key={s}>
                  <View style={{width:'1.5rem',height:'1.5rem',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'var(--instui-fs-xsmall)',fontWeight:700,border:'2px solid',...(step===s?{background:'var(--instui-blue-45)',color:'#fff',borderColor:'var(--instui-blue-45)'}:step>s?{background:'var(--instui-green-45)',color:'#fff',borderColor:'var(--instui-green-45)'}:{background:'#fff',color:'var(--instui-grey-24)',borderColor:'var(--instui-grey-14)'})}}>{step>s?'✓':s}</View>
                  <Text size="x-small" weight="bold" color={step===s?'primary':'placeholder'} transform="uppercase" letterSpacing="0.0625rem">{s===1?'Select Evidence':'Refine Profile'}</Text>
                  {s<2 && <View style={{width:'2rem',height:'1px',background:'var(--instui-line-stroke)'}}/>}
                </React.Fragment>
              ))}
            </Flex>
          </View>
          <button onClick={onCancel} style={{padding:'0.5rem',background:'transparent',border:0,cursor:'pointer',color:'var(--instui-grey-45)'}}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </Flex>

        <View padding="x-large" background="secondary" overflowY="auto" style={{flex:1}}>
          {step===1 && (
            <Flex direction="column" gap="medium" className="fade-in">
              <Card padding="medium">
                <Flex direction="column" gap="medium">
                  <View>
                    <label className="instui-label">Record Title *</label>
                    <input autoFocus type="text" value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. Software Engineering Portfolio" className="instui-input" style={{fontSize:'var(--instui-fs-medium)',fontWeight:700}}/>
                  </View>
                  <View>
                    <label className="instui-label">Target Role or Goal <Text size="x-small" color="placeholder" weight="normal">(optional)</Text></label>
                    <input type="text" value={targetRole} onChange={e=>setTargetRole(e.target.value)} placeholder="e.g. Cloud Architect, Graduate School, Product Manager" className="instui-input"/>
                  </View>
                </Flex>
              </Card>
              <Card padding="medium">
                <Flex justifyItems="space-between" alignItems="center" margin="0 0 medium">
                  <View>
                    <Heading level="h4">Select Credentials</Heading>
                    <Text as="p" size="x-small" color="placeholder" style={{margin:'2px 0 0'}}>{selectedIds.length} selected</Text>
                  </View>
                  <View style={{position:'relative',width:'14rem'}}>
                    <input type="text" placeholder="Search…" value={search} onChange={e=>setSearch(e.target.value)} className="instui-input" style={{paddingLeft:'2rem'}}/>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{position:'absolute',left:'0.625rem',top:'0.7rem',color:'var(--instui-grey-24)'}}><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                  </View>
                </Flex>
                <Flex direction="column" gap="medium" style={{maxHeight:'30rem',overflowY:'auto',paddingRight:'0.25rem'}}>
                  {Object.entries(grouped).map(([group,items])=>{
                    if(!items.length) return null;
                    return (
                      <View key={group}>
                        <Text size="x-small" weight="bold" color="placeholder" transform="uppercase" letterSpacing="0.0625rem" as="div" style={{marginBottom:'var(--instui-space-xs)'}}>{group} ({items.length})</Text>
                        <View style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(280px, 1fr))',gap:'var(--instui-space-xs)'}}>
                          {items.map(cred=>{
                            const sel = selectedIds.includes(cred.id);
                            return (
                              <View key={cred.id} onClick={()=>toggle(cred.id)} background={sel?'info':'primary'} borderWidth="small" borderColor={sel?'brand':'primary'} borderRadius="medium" padding="small" style={{cursor:'pointer'}}>
                                <Flex gap="x-small" alignItems="center">
                                  <View style={{width:'2.5rem',height:'2.5rem',background:'var(--instui-grey-11)',border:'var(--instui-bw-small) solid var(--instui-line-divider)',borderRadius:'var(--instui-br-medium)',overflow:'hidden',flexShrink:0}}>
                                    {cred.imageUrl && <img src={cred.imageUrl} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}} alt=""/>}
                                  </View>
                                  <Flex.Item shouldGrow shouldShrink>
                                    <Text as="div" size="x-small" weight="bold" className="truncate">{cred.name}</Text>
                                    <Text as="div" size="x-small" color="placeholder" className="truncate">{cred.issuer}</Text>
                                  </Flex.Item>
                                  <View style={{width:'1.25rem',height:'1.25rem',borderRadius:'50%',border:'2px solid',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,...(sel?{background:'var(--instui-blue-45)',borderColor:'var(--instui-blue-45)'}:{borderColor:'var(--instui-grey-14)'})}}>
                                    {sel && <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>}
                                  </View>
                                </Flex>
                              </View>
                            );
                          })}
                        </View>
                      </View>
                    );
                  })}
                </Flex>
              </Card>
            </Flex>
          )}

          {step===2 && (
            <Flex direction="column" gap="medium" className="fade-in">
              <Card padding="medium">
                <Flex justifyItems="space-between" alignItems="center" margin="0 0 medium">
                  <Flex gap="small" alignItems="center">
                    <View style={{width:'2.25rem',height:'2.25rem',borderRadius:'var(--instui-br-medium)',background:'linear-gradient(135deg, var(--instui-violet-45), var(--instui-blue-45))',display:'flex',alignItems:'center',justifyContent:'center'}}>
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    </View>
                    <View>
                      <Heading level="h4">AI-Generated Summary</Heading>
                      <Text as="p" size="x-small" color="placeholder" style={{margin:0}}>Powered by Claude · Edit freely to match your voice</Text>
                    </View>
                  </Flex>
                  {isGenerating && <Text size="x-small" weight="bold" color="brand">● Generating…</Text>}
                </Flex>
                <textarea value={summary} onChange={e=>setSummary(e.target.value)} rows={5} className="instui-textarea" style={{background:'var(--instui-grey-11)'}}/>
                <Flex justifyItems="flex-end" margin="small 0 0">
                  <Button color="ghost" size="sm" onClick={()=>handleGenerate(true)} isLoading={isGenerating}>↻ Regenerate</Button>
                </Flex>
              </Card>

              <Card padding="medium">
                <Flex justifyItems="space-between" alignItems="center" margin="0 0 medium">
                  <Heading level="h4">Skills Portfolio</Heading>
                  <Text size="x-small" color="placeholder" style={{fontStyle:'italic'}}>Edit or add skills to improve your match score</Text>
                </Flex>
                <Flex gap="x-small" margin="0 0 medium">
                  <Flex.Item shouldGrow><input type="text" value={newSkill} onChange={e=>setNewSkill(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addSkill()} placeholder="Add a skill…" className="instui-input"/></Flex.Item>
                  <Button color="primary" size="md" onClick={addSkill}>+ Add</Button>
                </Flex>
                {skills.length>0 && (
                  <View margin="0 0 medium">
                    <Text size="x-small" weight="bold" color="placeholder" transform="uppercase" letterSpacing="0.0625rem" as="div" style={{marginBottom:'var(--instui-space-xs)'}}>Verified Skills ({skills.length})</Text>
                    <Flex gap="x-small" wrap="wrap">
                      {skills.map((skill,idx)=>(
                        <Pill key={idx} color="info">
                          {skill}
                          <button onClick={()=>setSkills(p=>p.filter((_,i)=>i!==idx))} style={{background:'none',border:0,cursor:'pointer',color:'var(--instui-red-45)',padding:0,marginLeft:'4px',fontSize:'12px'}}>✕</button>
                        </Pill>
                      ))}
                    </Flex>
                  </View>
                )}
                {customSkills.length>0 && (
                  <View>
                    <Text size="x-small" weight="bold" color="placeholder" transform="uppercase" letterSpacing="0.0625rem" as="div" style={{marginBottom:'var(--instui-space-xs)'}}>Self-Declared Skills ({customSkills.length})</Text>
                    <Flex gap="x-small" wrap="wrap">
                      {customSkills.map((skill,idx)=>(
                        <Pill key={idx} color="warning">
                          {skill}
                          <button onClick={()=>setCustomSkills(p=>p.filter((_,i)=>i!==idx))} style={{background:'none',border:0,cursor:'pointer',color:'var(--instui-red-45)',padding:0,marginLeft:'4px',fontSize:'12px'}}>✕</button>
                        </Pill>
                      ))}
                    </Flex>
                  </View>
                )}
              </Card>

              <Card padding="medium">
                <Heading level="h4" margin="0 0 small">Visibility</Heading>
                <Flex gap="x-small">
                  {['Published','Private'].map(s=>(
                    <Flex.Item key={s} shouldGrow>
                      <Button color={status===s?(s==='Published'?'success':'secondary'):'secondary'} size="md" onClick={()=>setStatus(s)} style={{width:'100%'}}>{s==='Published'?'🌐 Public':'🔒 Private'}</Button>
                    </Flex.Item>
                  ))}
                </Flex>
                <Text as="p" size="x-small" color="placeholder" style={{margin:'var(--instui-space-xs) 0 0'}}>{status==='Published'?'Anyone with the link can view this record.':'Only you can see this record.'}</Text>
              </Card>
            </Flex>
          )}
        </View>

        <Flex justifyItems="space-between" alignItems="center" padding="small x-large" background="primary" style={{borderTop:'var(--instui-bw-small) solid var(--instui-line-stroke)'}}>
          <Button color="secondary" size="md" onClick={()=>step>1?setStep(1):onCancel()}>{step===1?'Cancel':'← Back'}</Button>
          <Flex gap="small" alignItems="center">
            {step===1 && selectedIds.length>0 && <Text size="x-small" color="placeholder">{selectedIds.length} credential{selectedIds.length!==1?'s':''} selected</Text>}
            {step===1 && <Button color="ai" size="md" onClick={()=>handleGenerate()} isLoading={isGenerating} disabled={!title.trim()}>✨ Generate LER →</Button>}
            {step===2 && <Button color="success" size="md" onClick={()=>onSave({id:initialLer?.id||Math.random().toString(36).slice(2,11),title,targetRole,executiveSummary:summary,skillsProfile:skills,customSkills,softSkills:initialLer?.softSkills||[],employmentHistory:initialLer?.employmentHistory||[],credentialIds:selectedIds,status,createdAt:initialLer?.createdAt||new Date().toISOString()})} disabled={!summary.trim()}>Save & Publish Record</Button>}
          </Flex>
        </Flex>
      </View>
    </Flex>
  );
};

// ═════════════════════ Dashboard Page ═════════════════════
const INDUSTRY_ISSUERS = ['Amazon Web Services','Frontend Masters','MIT Department of Computer Science','Coursera / Johns Hopkins','Project Management Institute','National Student Leadership Conference'];
const INST_COLORS = {
  'Mount Elbert University':'#1a5c8a',
  'Appletree High School':'#2d6a4f',
  'West Valley Community College':'#c95e1e',
  'University of Florida':'#0021A5',
  'The University of Alabama':'#9E1B32',
  'Professional & Industry':'#9242B4',
};

const DashboardPage = ({ credentials, onViewCLR, onAddCred }) => {
  const [search,setSearch] = React.useState('');
  const filtered = React.useMemo(()=>search?credentials.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())||c.issuer.toLowerCase().includes(search.toLowerCase())):credentials,[credentials,search]);
  const groups = React.useMemo(()=>{
    const g = {};
    filtered.forEach(c=>{ const k=INDUSTRY_ISSUERS.includes(c.issuer)?'Professional & Industry':c.issuer; if(!g[k])g[k]=[]; g[k].push(c); });
    return Object.entries(g).sort(([a],[b])=>a==='Professional & Industry'?1:b==='Professional & Industry'?-1:a.localeCompare(b));
  },[filtered]);

  return (
    <Flex direction="column" gap="large" className="fade-in">
      <Flex justifyItems="space-between" alignItems="center" gap="medium" wrap="wrap">
        <View>
          <Heading level="h1">Dashboard</Heading>
          <Text as="p" size="medium" color="secondary" style={{margin:'var(--instui-space-xxxs) 0 0'}}>{credentials.length} credentials from {groups.length} institution{groups.length!==1?'s':''}</Text>
        </View>
        <Flex gap="x-small" alignItems="center">
          <View style={{position:'relative',width:'14rem'}}>
            <input type="text" placeholder="Search credentials…" value={search} onChange={e=>setSearch(e.target.value)} className="instui-input" style={{paddingLeft:'2rem'}}/>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{position:'absolute',left:'0.625rem',top:'0.7rem',color:'var(--instui-grey-24)'}}><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </View>
          <Button color="secondary" size="md" onClick={onAddCred}>+ Add Credential</Button>
        </Flex>
      </Flex>

      {groups.length===0 && (
        <View background="primary" borderWidth="medium" borderColor="primary" borderRadius="medium" padding="x-large" style={{borderStyle:'dashed',textAlign:'center'}}>
          <Text as="p" weight="bold" color="placeholder">No credentials match your search.</Text>
        </View>
      )}

      {groups.map(([institution,creds])=>{
        const color = INST_COLORS[institution] || 'var(--instui-blue-45)';
        const hasCLR = creds.some(c=>c.type==='CLR');
        return (
          <View key={institution} background="primary" borderWidth="small" borderColor="primary" borderRadius="medium" shadow="resting" style={{overflow:'hidden'}}>
            <View style={{height:'0.375rem',background:color}}/>
            <View padding="medium">
              <Flex gap="small" alignItems="center" margin="0 0 medium">
                <View background="secondary" borderWidth="small" borderColor="primary" borderRadius="medium" style={{width:'2.75rem',height:'2.75rem',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  <Text size="large" weight="bold" style={{color}}>{institution.charAt(0)}</Text>
                </View>
                <View>
                  <Heading level="h4">{institution}</Heading>
                  <Text as="p" size="x-small" color="placeholder" style={{margin:'2px 0 0'}}>{creds.length} credential{creds.length!==1?'s':''}{hasCLR?' · Includes Co-curricular Record':''}</Text>
                </View>
              </Flex>
              <View style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(320px, 1fr))',gap:'var(--instui-space-xs)'}}>
                {creds.map(cred=><CredentialCard key={cred.id} credential={cred} onView={onViewCLR}/>)}
              </View>
            </View>
          </View>
        );
      })}
    </Flex>
  );
};

      <View style={{borderBottom:'var(--instui-bw-small) solid var(--instui-line-divider)',paddingBottom:'var(--instui-space-xs)',marginBottom:'var(--instui-space-md)'}}>
        <Text size="x-small" weight="bold" transform="uppercase" letterSpacing="0.125rem">Account</Text>
      </View>
      <Flex direction="column" gap="x-small">
        {[{title:'Authentication Settings',desc:'Password, two-factor authentication, and sign-in options'},{title:'Privacy Settings',desc:'Control who can view and share your records'}].map(item=>(
          <Flex key={item.title} justifyItems="space-between" alignItems="center" padding="small medium-small" background="secondary" borderRadius="medium">
            <View>
              <Text size="small" weight="bold" as="div">{item.title}</Text>
              <Text size="x-small" color="placeholder" as="div" style={{marginTop:'2px'}}>{item.desc}</Text>
            </View>
            <Button color="secondary" size="sm">Manage →</Button>
          </Flex>
        ))}
      </Flex>
    </Card>
  </Flex>
);

// ═════════════════════ Public LER View ═════════════════════
const PublicLERView = ({ ler, credentials }) => {
  const lerCreds = credentials.filter(c=>ler.credentialIds.includes(c.id));
  const allSkills = [...(ler.skillsProfile||[]),...(ler.customSkills||[])];
  return (
    <View background="secondary" minHeight="100vh">
      <Flex alignItems="center" padding="0 large" className="no-print" style={{background:'var(--instui-grey-100)',height:'3.5rem'}}>
        <Flex gap="x-small" alignItems="center">
          <View style={{width:'1.75rem',height:'1.75rem',background:'var(--instui-blue-45)',borderRadius:'var(--instui-br-medium)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <Text size="small" weight="bold" color="inverse">P</Text>
          </View>
          <Text weight="bold" color="inverse">Parchment</Text>
          <Text size="x-small" color="inverse" transform="uppercase" letterSpacing="0.125rem" style={{opacity:0.5}}>by Instructure</Text>
        </Flex>
      </Flex>
      <View padding="large medium" maxWidth="48rem" margin="0 auto">
        <Card padding="x-large" style={{textAlign:'center',marginBottom:'var(--instui-space-lg)'}}>
          <img src="https://picsum.photos/seed/jessica/80/80" style={{width:'5rem',height:'5rem',borderRadius:'50%',margin:'0 auto var(--instui-space-msm)',border:'2px solid var(--instui-line-stroke)',display:'block'}} alt="Jordan K. Anderson"/>
          <Heading level="h2" margin="0 0 xx-small">Jordan K. Anderson</Heading>
          <Text size="x-small" weight="bold" color="placeholder" transform="uppercase" letterSpacing="0.125rem" as="div" style={{marginBottom:'var(--instui-space-md)'}}>Learning & Employment Record</Text>
          <Heading level="h3" color="brand" margin="0 0 x-small">{ler.title}</Heading>
          {ler.targetRole && <Text as="p" size="small" color="secondary" style={{margin:'var(--instui-space-xs) 0 0'}}>Looking for: <Text weight="bold">{ler.targetRole}</Text></Text>}
          <View margin="medium 0 0">
            <Button color="primary" size="md" onClick={()=>window.print()}>⬇ Download PDF</Button>
          </View>
        </Card>

        <Card padding="medium" style={{marginBottom:'var(--instui-space-msm)'}}>
          <Text size="x-small" weight="bold" color="brand" transform="uppercase" letterSpacing="0.125rem" as="div" style={{marginBottom:'var(--instui-space-xs)'}}>Summary</Text>
          <View style={{borderLeft:'2px solid var(--instui-line-divider)',paddingLeft:'var(--instui-space-msm)'}}>
            <Text as="p" size="small" color="secondary" style={{margin:0,fontStyle:'italic',lineHeight:'var(--instui-lh-default)'}}>"{ler.executiveSummary}"</Text>
          </View>
        </Card>

        {allSkills.length>0 && (
          <Card padding="medium" style={{marginBottom:'var(--instui-space-msm)'}}>
            <Text size="x-small" weight="bold" color="brand" transform="uppercase" letterSpacing="0.125rem" as="div">Skills</Text>
            <Text as="p" size="x-small" color="placeholder" style={{margin:'2px 0 var(--instui-space-msm)'}}>Click any skill to view market data on Talent Neuron</Text>
            <Flex gap="x-small" wrap="wrap">
              {allSkills.map(skill=>(
                <a key={skill} href={talentNeuronUrl(skill)} target="_blank" rel="noopener noreferrer" style={{textDecoration:'none'}}>
                  <Pill color="info">{skill} ↗</Pill>
                </a>
              ))}
            </Flex>
          </Card>
        )}

        {lerCreds.length>0 && (
          <Card padding="medium" style={{marginBottom:'var(--instui-space-msm)'}}>
            <Text size="x-small" weight="bold" color="brand" transform="uppercase" letterSpacing="0.125rem" as="div" style={{marginBottom:'var(--instui-space-msm)'}}>Credentials ({lerCreds.length})</Text>
            <View style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(280px, 1fr))',gap:'var(--instui-space-xs)'}}>
              {lerCreds.map(cred=><CredentialCard key={cred.id} credential={cred}/>)}
            </View>
          </Card>
        )}

        <View padding="medium 0" style={{textAlign:'center'}}>
          <Text size="x-small" color="placeholder">Verified by Parchment by Instructure · {new Date().toLocaleDateString(undefined,{month:'long',year:'numeric'})}</Text>
        </View>
      </View>
    </View>
  );
};

// ═════════════════════ TopNavBar / Tabs ═════════════════════
const TopNavBar = ({ onLogoClick }) => (
  <View as="header" background="primary-inverse" className="no-print" style={{position:'sticky',top:0,zIndex:40,height:'4rem',borderBottom:'var(--instui-bw-small) solid rgba(0,0,0,0.2)'}}>
    <View maxWidth="80rem" margin="0 auto" padding="0 medium" style={{height:'100%'}}>
      <Flex alignItems="center" justifyItems="space-between" style={{height:'100%'}}>
        <Flex gap="x-small" alignItems="center" onClick={onLogoClick} style={{cursor:'pointer'}}>
          <View style={{width:'2rem',height:'2rem',background:'var(--instui-blue-45)',borderRadius:'var(--instui-br-medium)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <Text size="medium" weight="bold" color="inverse">P</Text>
          </View>
          <Flex direction="column" style={{lineHeight:1}}>
            <Text size="large" weight="bold" color="inverse">Parchment</Text>
            <Text size="x-small" color="inverse" transform="uppercase" letterSpacing="0.125rem" style={{opacity:0.6}}>by Instructure</Text>
          </Flex>
        </Flex>
        <Flex gap="x-small" alignItems="center">
          <img src="https://picsum.photos/seed/jessica/32/32" style={{width:'2rem',height:'2rem',borderRadius:'50%',border:'2px solid rgba(255,255,255,0.3)'}} alt=""/>
          <Text size="small" color="inverse" style={{opacity:0.9}}>Hello, <Text weight="bold" color="inverse">Jessica</Text></Text>
        </Flex>
      </Flex>
    </View>
  </View>
);

const TabNav = ({ tabs, value, onChange }) => (
  <View background="primary" className="no-print" style={{borderBottom:'var(--instui-bw-small) solid var(--instui-line-stroke)'}}>
    <View maxWidth="80rem" margin="0 auto" padding="0 medium">
      <div className="instui-tabs" role="tablist">
        {tabs.map(t=>(
          <button key={t} role="tab" aria-selected={value===t} className="instui-tab" onClick={()=>onChange(t)}>{t}</button>
        ))}
      </div>
    </View>
  </View>
);

// ═════════════════════ App ═════════════════════
const App = () => {
  const lerViewId = React.useMemo(()=>new URLSearchParams(window.location.search).get('lerView'),[]);
  const [tab,setTab] = React.useState('Dashboard');
  const [lers,setLers] = React.useState([INITIAL_LER]);
  const [credentials,setCredentials] = React.useState(MOCK_CREDENTIALS);
  const [activeLerId,setActiveLerId] = React.useState('ler-1');
  const [viewingLerId,setViewingLerId] = React.useState(null);
  const [showBuilder,setShowBuilder] = React.useState(false);
  const [editingLer,setEditingLer] = React.useState(null);
  const [showAddCred,setShowAddCred] = React.useState(false);
  const [clrPreviewId,setClrPreviewId] = React.useState(null);

  if (lerViewId) {
    const publicLer = lers.find(l=>l.id===lerViewId) || (lerViewId===INITIAL_LER.id?INITIAL_LER:null);
    if (!publicLer) return (
      <Flex alignItems="center" justifyItems="center" style={{minHeight:'100vh'}} background="secondary">
        <View style={{textAlign:'center'}}>
          <Text as="p" style={{fontSize:'3rem',marginBottom:'var(--instui-space-msm)'}}>🔍</Text>
          <Heading level="h3">Learning & Employment Record not found.</Heading>
        </View>
      </Flex>
    );
    return <PublicLERView ler={publicLer} credentials={credentials}/>;
  }

  const viewingLer = lers.find(l=>l.id===viewingLerId) || null;
  const saveLer = ler => { setLers(prev=>{const ex=prev.find(l=>l.id===ler.id);return ex?prev.map(l=>l.id===ler.id?ler:l):[ler,...prev];}); setActiveLerId(ler.id); setShowBuilder(false); setEditingLer(null); };
  const deleteLer = id => { if(!confirm('Delete this Learning & Employment Record? This cannot be undone.')) return; setLers(prev=>prev.filter(l=>l.id!==id)); if(activeLerId===id) setActiveLerId(lers.find(l=>l.id!==id)?.id||''); if(viewingLerId===id) setViewingLerId(null); };

  const TABS = ['Dashboard','Opportunities','Orders','Settings'];

  return (
    <View background="secondary" minHeight="100vh" style={{display:'flex',flexDirection:'column'}}>
      <TopNavBar onLogoClick={()=>{setViewingLerId(null);setTab('Dashboard');}}/>
      {!viewingLerId && <TabNav tabs={TABS} value={tab} onChange={setTab}/>}

      <View as="main" maxWidth="80rem" width="100%" margin="0 auto" padding="large medium" style={{flex:1}}>
        {clrPreviewId && <CLRPreviewModal credential={credentials.find(c=>c.id===clrPreviewId)} onClose={()=>setClrPreviewId(null)}/>}
        {viewingLerId && viewingLer && <LERDetailView ler={viewingLer} credentials={credentials} onBack={()=>setViewingLerId(null)} onEdit={()=>{setEditingLer(viewingLer);setShowBuilder(true);}} onUpdate={u=>setLers(prev=>prev.map(l=>l.id===u.id?u:l))} isOwner={true}/>}
        {!viewingLerId && tab==='Dashboard' && <DashboardPage credentials={credentials} onViewCLR={id=>setClrPreviewId(id)} onAddCred={()=>setShowAddCred(true)}/>}
        {!viewingLerId && tab==='Opportunities' && <OpportunitiesPage lers={lers} activeLerId={activeLerId} credentials={credentials} onSetActiveLer={setActiveLerId} onViewLer={id=>setViewingLerId(id)} onNewLer={()=>setShowBuilder(true)} onEditLer={ler=>{setEditingLer(ler);setShowBuilder(true);}} onDeleteLer={deleteLer} onToggleLerStatus={id=>setLers(prev=>prev.map(l=>l.id===id?{...l,status:l.status==='Published'?'Private':'Published'}:l))}/>}
        {!viewingLerId && tab==='Orders' && <OrdersPage/>}
        {!viewingLerId && tab==='Settings' && <SettingsPage/>}
      </View>

      {showBuilder && <LERBuilder credentials={credentials} initialLer={editingLer} initialSelectedIds={[]} onSave={saveLer} onCancel={()=>{setShowBuilder(false);setEditingLer(null);}}/>}
      {showAddCred && <AddCredentialModal onSave={cred=>{setCredentials(prev=>[cred,...prev]);setShowAddCred(false);}} onCancel={()=>setShowAddCred(false)}/>}
    </View>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
